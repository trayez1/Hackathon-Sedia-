services:
  # --- Backend: Node/Express + SQLite API ---------------------------------
  - type: web
    runtime: node
    name: okayuway-backend
    plan: starter # "free" plan cannot attach a persistent disk — see RENDER.md
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: okayuway-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/okayuway.sqlite
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: UPLOADS_URL_PREFIX
        value: /uploads
      - key: SECURE_UPLOADS_DIR
        value: /data/secure-uploads
      - key: VERIFICATION_DOCUMENT_RETENTION_DAYS
        value: "30"
      - key: CORS_ORIGIN
        value: https://okayuway-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN1_NAME
        value: Adib (Accessibility Officer)
      - key: ADMIN1_EMAIL
        value: adib@mmu.demo
      - key: ADMIN1_PASSWORD
        sync: false # set this in the Render dashboard, don't commit it
      - key: ADMIN2_NAME
        value: Aniq (Accessibility Officer)
      - key: ADMIN2_EMAIL
        value: aniq@mmu.demo
      - key: ADMIN2_PASSWORD
        sync: false # set this in the Render dashboard, don't commit it

  # --- Frontend: Vite build served as a static site -----------------------
  - type: web
    runtime: static
    name: okayuway-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://okayuway-backend.onrender.com
